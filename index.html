<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather SPA - Test Forecast</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        li {
            padding: 8px;
            background: #f4f4f4;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        .error {
            color: #d9534f;
        }
    </style>
</head>
<body>

    <h1>Test 5-Day Forecast Service</h1>
    <p>Napiš město a klikni na výsledek pro načtení předpovědi:</p>

    <input type="text" id="cityInput" placeholder="Zadej město..." autocomplete="off">
    <div id="status"></div>
    <ul id="resultsList"></ul>

    <h2>Výsledek předpovědi:</h2>
    <div id="forecastStatus"></div>
    <ul id="forecastList"></ul>

    <script type="module">
        import { ApiClient } from './js/api/ApiClient.js';
        import { GeocodingService } from './js/services/GeocodingService.js';
        import { ForecastService } from './js/services/ForecastService.js';

        const API_KEY = '';
        const BASE_URL = 'https://api.openweathermap.org';

        const apiClient = new ApiClient(BASE_URL, { appid: API_KEY });
        const geocodingService = new GeocodingService(apiClient, 5);
        const forecastService = new ForecastService(apiClient);

        const input = document.getElementById('cityInput');
        const statusDiv = document.getElementById('status');
        const resultsList = document.getElementById('resultsList');
        const forecastStatus = document.getElementById('forecastStatus');
        const forecastList = document.getElementById('forecastList');

        // --- Geocoding Listeners ---
        geocodingService.addEventListener('search:start', (e) => {
            statusDiv.innerHTML = `<span class="loading">Hledám lokaci "${e.detail.query}"...</span>`;
            resultsList.innerHTML = '';
        });

        geocodingService.addEventListener('search:success', (e) => {
            statusDiv.innerHTML = '';
            const locations = e.detail;

            if (locations.length === 0) {
                resultsList.innerHTML = '<li>Žádná města nenalezena.</li>';
                return;
            }

            locations.forEach(loc => {
                const li = document.createElement('li');
                li.style.cursor = 'pointer';
                li.textContent = `📍 ${loc.name} (${loc.country}${loc.state ? `, ${loc.state}` : ''}) — Klikni pro předpověď`;

                // Po kliknutí na město spustíme načtení předpovědi
                li.addEventListener('click', () => {
                    forecastService.fetchForecast(loc.lat, loc.lon);
                });

                resultsList.appendChild(li);
            });
        });

        geocodingService.addEventListener('search:error', (e) => {
            statusDiv.innerHTML = `<span class="error">Chyba geokódování: ${e.detail.message}</span>`;
        });

        // --- Forecast Listeners ---
        forecastService.addEventListener('forecast:start', (e) => {
            forecastStatus.innerHTML = `<span class="loading">Načítám předpověď pro [${e.detail.lat}, ${e.detail.lon}]...</span>`;
            forecastList.innerHTML = '';
        });

        forecastService.addEventListener('forecast:success', (e) => {
            const data = e.detail;
            forecastStatus.innerHTML = `<strong>Město:</strong> ${data.city.name} (${data.city.country}) — Počet záznamů: ${data.cnt}`;

            // Vykreslíme prvních několik 3hodinových kroků předpovědi
            data.list.slice(0, 8).forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.dt_txt}: ${item.main.temp} °C, ${item.weather[0].description} (Vítr: ${item.wind.speed} m/s)`;
                forecastList.appendChild(li);
            });
        });

        forecastService.addEventListener('forecast:error', (e) => {
            forecastStatus.innerHTML = `<span class="error">Chyba předpovědi: ${e.detail.message}</span>`;
        });

        // Vstup uživatele pro geokódování
        input.addEventListener('input', (e) => {
            geocodingService.searchLocations(e.target.value);
        });
    </script>

</body>
</html>
