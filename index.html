<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather SPA - Test Geocoding</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        li {
            padding: 8px;
            background: #f4f4f4;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        .error {
            color: #d9534f;
        }
    </style>
</head>
<body>

    <h1>Test Geocoding Service</h1>
    <p>Začni psát název města (např. Prag, London, Olomouc):</p>

    <input type="text" id="cityInput" placeholder="Zadej město..." autocomplete="off">
    <div id="status"></div>
    <ul id="resultsList"></ul>

    <!-- Důležité: type="module" pro podporu ES importů -->
    <script type="module">
        import { ApiClient } from './js/api/ApiClient.js';
        import { GeocodingService } from './js/services/GeocodingService.js';

        // Inicializace s tvým OpenWeatherMap API klíčem
        const API_KEY = '';
        const BASE_URL = 'https://api.openweathermap.org';

        const apiClient = new ApiClient(BASE_URL, { appid: API_KEY });
        const geocodingService = new GeocodingService(apiClient, 5);

        // UI elementy
        const input = document.getElementById('cityInput');
        const statusDiv = document.getElementById('status');
        const resultsList = document.getElementById('resultsList');

        // Napojení Event-Driven listenerů ze služby
        geocodingService.addEventListener('search:start', (e) => {
            statusDiv.innerHTML = `<span class="loading">Hledám lokaci "${e.detail.query}"...</span>`;
            resultsList.innerHTML = '';
        });

        geocodingService.addEventListener('search:success', (e) => {
            statusDiv.innerHTML = '';
            const locations = e.detail;

            if (locations.length === 0) {
                resultsList.innerHTML = '<li>Žádná města nenalezena.</li>';
                return;
            }

            locations.forEach(loc => {
                const li = document.createElement('li');
                li.textContent = `${loc.name} (${loc.country}${loc.state ? `, ${loc.state}` : ''}) — Lat: ${loc.lat}, Lon: ${loc.lon}`;
                resultsList.appendChild(li);
            });
        });

        geocodingService.addEventListener('search:error', (e) => {
            statusDiv.innerHTML = `<span class="error">Chyba: ${e.detail.message}</span>`;
        });

        // Sledování vstupu uživatele
        input.addEventListener('input', (e) => {
            const query = e.detail ? e.detail : e.target.value;
            geocodingService.searchLocations(query);
        });
    </script>

</body>
</html>
